<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears -->
  <circle cx="14" cy="18" r="5" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <circle cx="34" cy="18" r="5" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <!-- Head -->
  <rect x="10" y="16" width="28" height="24" rx="12" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <!-- Muzzle -->
  <ellipse cx="24" cy="32" rx="8" ry="5.5" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2" />
  <!-- Nose -->
  <ellipse cx="24" cy="29.5" rx="2.5" ry="1.5" fill="#1E1E1E" />
  <!-- Mouth (Pondering line) -->
  <path d="M22 33 L 26 33" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round" />
  <!-- Eyes (Thinking: one narrow, one open) -->
  <circle cx="17" cy="24" r="2" fill="#1E1E1E" />
  <circle cx="31" cy="24" r="2" fill="#1E1E1E" />
  <!-- Eyebrows (frowning / thinking) -->
  <path d="M15 21 L 19 22" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round" />
  <path d="M33 21 L 29 22" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round" />
  
  <!-- Hand on chin -->
  <circle cx="21" cy="37" r="4" fill="#E8961F" stroke="#1E1E1E" stroke-width="2.5" />
  
  <!-- Lightbulb (Secondary Teal #2BA69E) -->
  <path d="M36 10 C 36 6, 42 6, 42 10 C 42 12, 40 13, 40 15 L 38 15 C 38 13, 36 12, 36 10 Z" fill="#2BA69E" stroke="#1E1E1E" stroke-width="2" />
  <rect x="38" y="15" width="2" height="3" fill="#1E1E1E" />
  <!-- Glow lines (Accent #E84545) -->
  <path d="M39 1 L 39 3 M 33 6 L 35 7.5 M 45 6 L 43 7.5" stroke="#E84545" stroke-width="2" stroke-linecap="round" />
</svg>
