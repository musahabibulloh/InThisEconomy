<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears -->
  <circle cx="16" cy="12" r="5" fill="#E8961F" stroke="#1E1E1E" stroke-width="2.5" />
  <circle cx="32" cy="12" r="5" fill="#E8961F" stroke="#1E1E1E" stroke-width="2.5" />
  <!-- Head (Peeking) -->
  <rect x="12" y="10" width="24" height="22" rx="11" fill="#E8961F" stroke="#1E1E1E" stroke-width="2.5" />
  <!-- Eyes -->
  <circle cx="19" cy="17" r="2" fill="#1E1E1E" />
  <circle cx="29" cy="17" r="2" fill="#1E1E1E" />
  <!-- Muzzle -->
  <ellipse cx="24" cy="22" rx="5" ry="3.5" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="1.5" />
  <!-- Nose -->
  <ellipse cx="24" cy="20.5" rx="1.5" ry="1" fill="#1E1E1E" />

  <!-- Dashboard Grid (4 squares) covering the lower half -->
  <!-- Square 1 (Top-Left) -->
  <rect x="13" y="26" width="10" height="10" rx="2" fill="#E84545" stroke="#1E1E1E" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Square 2 (Top-Right) -->
  <rect x="25" y="26" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Square 3 (Bottom-Left) -->
  <rect x="13" y="38" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Square 4 (Bottom-Right) -->
  <rect x="25" y="38" width="10" height="10" rx="2" fill="#2BA69E" stroke="#1E1E1E" stroke-width="2.5" stroke-linejoin="round" />
</svg>
