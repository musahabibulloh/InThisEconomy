<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears -->
  <circle cx="12" cy="14" r="6" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <circle cx="36" cy="14" r="6" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <!-- Inner Ears -->
  <circle cx="12" cy="14" r="2.5" fill="#CB7E12" />
  <circle cx="36" cy="14" r="2.5" fill="#CB7E12" />
  
  <!-- Head -->
  <rect x="8" y="12" width="32" height="28" rx="14" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  
  <!-- Muzzle -->
  <ellipse cx="24" cy="30" rx="10" ry="7" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2" />
  <!-- Nose -->
  <ellipse cx="24" cy="27" rx="3" ry="2" fill="#1E1E1E" />
  
  <!-- Left Arm (covering left eye) -->
  <g transform="translate(16, 30) rotate(15)">
    <rect x="-6" y="-14" width="12" height="28" rx="6" fill="#E8961F" stroke="#1E1E1E" stroke-width="2.5" />
    <path d="M -2 -14 L -2 -8" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 2 -14 L 2 -8" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Right Arm (covering right eye) -->
  <g transform="translate(32, 30) rotate(-15)">
    <rect x="-6" y="-14" width="12" height="28" rx="6" fill="#E8961F" stroke="#1E1E1E" stroke-width="2.5" />
    <path d="M -2 -14 L -2 -8" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 2 -14 L 2 -8" stroke="#1E1E1E" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
