<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Bear face - Neutral (medium-rated competitor) -->
  <!-- Ears -->
  <circle cx="12" cy="10" r="8" fill="#C68642"/>
  <circle cx="12" cy="10" r="5" fill="#DEAA76"/>
  <circle cx="36" cy="10" r="8" fill="#C68642"/>
  <circle cx="36" cy="10" r="5" fill="#DEAA76"/>
  <!-- Head -->
  <circle cx="24" cy="24" r="16" fill="#C68642"/>
  <!-- Inner face -->
  <ellipse cx="24" cy="26" rx="11" ry="10" fill="#DEAA76"/>
  <!-- Eyes - neutral dots -->
  <circle cx="18" cy="20" r="2.2" fill="#3D2B1F"/>
  <circle cx="30" cy="20" r="2.2" fill="#3D2B1F"/>
  <!-- Eye shine -->
  <circle cx="19" cy="19" r="0.7" fill="white"/>
  <circle cx="31" cy="19" r="0.7" fill="white"/>
  <!-- Nose -->
  <ellipse cx="24" cy="26" rx="3.5" ry="2.5" fill="#3D2B1F"/>
  <ellipse cx="23.5" cy="25.2" rx="1" ry="0.6" fill="#7B5B3A" opacity="0.5"/>
  <!-- Neutral straight mouth -->
  <line x1="20" y1="31" x2="28" y2="31" stroke="#3D2B1F" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Light blush -->
  <circle cx="14" cy="27" r="2.5" fill="#FF9999" opacity="0.25"/>
  <circle cx="34" cy="27" r="2.5" fill="#FF9999" opacity="0.25"/>
</svg>
