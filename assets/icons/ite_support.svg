<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Bear body -->
  <circle cx="32" cy="36" r="18" fill="#D4A574"/>
  <!-- Ears -->
  <circle cx="18" cy="20" r="8" fill="#D4A574"/>
  <circle cx="46" cy="20" r="8" fill="#D4A574"/>
  <circle cx="18" cy="20" r="5" fill="#C49460"/>
  <circle cx="46" cy="20" r="5" fill="#C49460"/>
  <!-- Face -->
  <circle cx="32" cy="34" r="16" fill="#E8C9A0"/>
  <!-- Muzzle -->
  <ellipse cx="32" cy="38" rx="8" ry="6" fill="#F5DFC0"/>
  <!-- Nose -->
  <ellipse cx="32" cy="36" rx="3" ry="2" fill="#6B4226"/>
  <!-- Eyes - gentle/warm -->
  <path d="M24 30 Q26 28 28 30" stroke="#6B4226" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M36 30 Q38 28 40 30" stroke="#6B4226" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Warm smile -->
  <path d="M28 40 Q32 43 36 40" stroke="#6B4226" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <circle cx="23" cy="36" r="3" fill="#E8961F" opacity="0.2"/>
  <circle cx="41" cy="36" r="3" fill="#E8961F" opacity="0.2"/>
  <!-- Hand reaching out (support gesture) -->
  <ellipse cx="50" cy="40" rx="5" ry="3.5" fill="#D4A574" transform="rotate(-15 50 40)"/>
  <!-- Small heart -->
  <path d="M52 32 C52 30 54 29 55 30.5 C56 29 58 30 58 32 C58 34 55 36 55 36 C55 36 52 34 52 32Z" fill="#E84545" opacity="0.6"/>
  <!-- Celemek -->
  <path d="M24 46 L32 50 L40 46" stroke="#E8961F" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
