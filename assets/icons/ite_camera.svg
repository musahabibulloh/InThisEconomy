<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears -->
  <circle cx="14" cy="14" r="5" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <circle cx="34" cy="14" r="5" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <!-- Head -->
  <rect x="10" y="12" width="28" height="24" rx="12" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  
  <!-- Left Eye (Happy arc) -->
  <path d="M15 21 Q 17 18 19 21" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Right Eye (Winking arc) -->
  <path d="M29 21 Q 31 18 33 21" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round" fill="none" />
  
  <!-- Camera (Accent #E84545 Body, Secondary Teal lens) -->
  <rect x="14" y="24" width="20" height="14" rx="3" fill="#E84545" stroke="#1E1E1E" stroke-width="2.5" />
  <circle cx="24" cy="31" r="5" fill="#2BA69E" stroke="#1E1E1E" stroke-width="2" />
  <!-- Camera Flash/Details -->
  <rect x="17" y="26" width="3" height="2" rx="1" fill="#FFFFFF" />
  
  <!-- Hands holding camera -->
  <circle cx="12" cy="31" r="4" fill="#E8961F" stroke="#1E1E1E" stroke-width="2.5" />
  <circle cx="36" cy="31" r="4" fill="#E8961F" stroke="#1E1E1E" stroke-width="2.5" />
</svg>
