<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ears -->
  <circle cx="12" cy="16" r="5" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <circle cx="32" cy="16" r="5" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <!-- Head -->
  <rect x="8" y="14" width="28" height="24" rx="12" fill="#E8961F" stroke="#1E1E1E" stroke-width="3" />
  <!-- Muzzle -->
  <ellipse cx="22" cy="30" rx="8" ry="5.5" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="2" />
  <ellipse cx="22" cy="27.5" rx="2.5" ry="1.5" fill="#1E1E1E" />
  <!-- Mouth (curious round) -->
  <circle cx="22" cy="31.5" r="1.5" fill="#1E1E1E" />
  <!-- Eyes (alert / focused) -->
  <circle cx="15" cy="22" r="2" fill="#1E1E1E" />
  <!-- Right eye is big behind glass (simulated by having big eye) -->
  <circle cx="28" cy="22" r="3.5" fill="#1E1E1E" />
  
  <!-- Magnifying Glass Handle -->
  <line x1="38" y1="38" x2="33" y2="33" stroke="#1E1E1E" stroke-width="4" stroke-linecap="round" />
  <circle cx="28" cy="22" r="10" fill="#2BA69E" fill-opacity="0.3" stroke="#1E1E1E" stroke-width="3" />
  <!-- Reflection on glass -->
  <path d="M22 17 A 6 6 0 0 1 27 15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Hand holding handle -->
  <circle cx="34" cy="35" r="4" fill="#E8961F" stroke="#1E1E1E" stroke-width="2.5" />
</svg>
